name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: tasksdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Load schema
        run: mysql -h 127.0.0.1 -uroot -pdevpass tasksdb < db/schema.sql
      - name: Build
        run: dotnet build --nologo
      - name: Test
        run: dotnet test --no-build --nologo
